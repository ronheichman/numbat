id: privilege.sudoers_tamper
version: "1.5"
enabled: true
title: Agent targeted sudoers policy for modification
description: |-
  The agent wrote a sudoers file or requested a command that can modify sudoers policy.
  Successful changes can alter who may become root, including without another password
  prompt.
severity: high
expr: |-
  (
    (event.event_type == "file.write" || event.event_type == "file.delete") &&
    canonical_path(event.file_path).matches("^/etc/sudoers$|^/etc/sudoers\\.d/[^/]+$")
  ) || (
    (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
    shell_commands.exists(command,
      (
        command.name.matches("(?i)^visudo$") &&
        !command.argv.exists(arg,
          arg.matches("^(--check|--help|--version|--export)(=.*)?$") ||
          arg.matches("^-[qs]*c[qs]*(f.*)?$") ||
          arg.matches("^-[qs]*x.*$") ||
          arg in ["-h", "-V"]
        ) &&
        (
          (
            !command.argv.exists(arg,
              arg.matches("^--file(=.*)?$") ||
              arg.matches("^-[qs]*f.*$")
            ) &&
            command.argv.slice(1, command.argv.size()).all(arg,
              arg.matches("^-[qs]+$") ||
              arg in ["--quiet", "--strict"]
            )
          ) ||
          lists.range(command.argv.size()).exists(i,
            i > 0 &&
            (
              (
                command.argv[i].startsWith("--file=") &&
                canonical_path(command.argv[i].substring(7)).matches("^/etc/sudoers(\\.d/[^/]+)?$")
              ) ||
              (
                command.argv[i].matches("^-[qs]*f.+$") &&
                canonical_path(command.argv[i].substring(command.argv[i].indexOf("f") + 1)).matches("^/etc/sudoers(\\.d/[^/]+)?$")
              ) ||
              (
                (command.argv[i] == "--file" || command.argv[i].matches("^-[qs]*f$")) &&
                i + 1 < command.argv.size() &&
                canonical_path(command.argv[i + 1]).matches("^/etc/sudoers(\\.d/[^/]+)?$")
              )
            )
          )
        )
      ) ||
      command.redirects.exists(redirect,
        redirect.op in ["write", "append"] &&
        canonical_path(redirect.target).matches("(?i)^/etc/sudoers(\\.d/[^/]+)?$")
      ) ||
      lists.range(command.argv.size()).exists(i,
        i > 0 &&
        canonical_path(command.argv[i]).matches("(?i)^/etc/sudoers(\\.d/[^/]+)?$") &&
        (
          command.name.matches("(?i)^(rm|truncate|tee)$") ||
          (
            command.name.matches("(?i)^sed$") &&
            command.argv.exists(arg, arg.matches("(?i)^(-i|--in-place)(=.*)?$"))
          ) ||
          command.name.matches("(?i)^mv$") ||
          (
            command.name.matches("(?i)^(cp|install)$") &&
            !command.argv.exists(arg,
              arg in ["-t", "--target-directory"] ||
              arg.startsWith("--target-directory=") ||
              arg.matches("^-[^-]*t.+$")
            ) &&
            (
              i == command.argv.size() - 1 ||
              command.argv[i - 1].matches("(?i)^(-t|--target-directory)$") ||
              command.argv.slice(i + 1, command.argv.size()).all(arg,
                arg.matches("(?i)^(-f|--force|-i|--interactive|-n|--no-clobber|-T|--no-target-directory|-v|--verbose)$")
              )
            )
          ) ||
          (
            command.name.matches("(?i)^(set-content|add-content|clear-content|out-file|remove-item|ri|new-item)$") &&
            (
              i == 1 ||
              command.argv[i - 1].matches("(?i)^-(path|literalpath|filepath)$") ||
              lists.range(i).all(j,
                j == 0 ||
                command.argv[j].matches("(?i)^-(force|nonewline|passthru|append|noclobber|recurse|whatif|confirm)(:.*)?$")
              )
            )
          ) ||
          (
            command.name.matches("(?i)^copy-item$") &&
            (
              command.argv[i - 1].matches("(?i)^-destination$") ||
              (
                i > 1 &&
                lists.range(command.argv.size()).all(j,
                  j <= i ||
                  command.argv[j].matches("(?i)^-(force|recurse|container|passthru|whatif|confirm)(:.*)?$")
                )
              )
            )
          ) ||
          (
            command.name.matches("(?i)^move-item$") &&
            (
              i == 1 ||
              command.argv[i - 1].matches("(?i)^-(path|literalpath|destination)$") ||
              i == command.argv.size() - 1 ||
              lists.range(i).all(j,
                j == 0 ||
                command.argv[j].matches("(?i)^-(force|recurse|container|passthru|whatif|confirm)(:.*)?$")
              )
            )
          )
        )
      ) ||
      (
        command.name.matches("(?i)^(cp|mv|install)$") &&
        lists.range(command.argv.size()).exists(i,
          i > 0 &&
          canonical_path(command.argv[i]) == "/etc/sudoers.d" &&
          (
            (
              command.argv[i - 1].matches("(?i)^(-t|--target-directory)$") &&
              !lists.range(command.argv.size()).exists(k,
                k > i &&
                (
                  command.argv[k] in ["-t", "--target-directory"] ||
                  command.argv[k].startsWith("--target-directory=") ||
                  command.argv[k].matches("^-[^-]*t.+$")
                )
              ) &&
              lists.range(command.argv.size()).exists(j,
                j > 0 &&
                j != i &&
                !command.argv[j].startsWith("-") &&
                (j == 1 || !command.argv[j - 1].matches("(?i)^(-S|--suffix|-g|--group|-m|--mode|-o|--owner|--strip-program|--context|--sparse)$"))
              )
            ) ||
            (
              i > 1 &&
              !command.argv.exists(arg,
                arg in ["-t", "--target-directory"] ||
                arg.startsWith("--target-directory=") ||
                arg.matches("^-[^-]*t.+$")
              ) &&
              command.argv.slice(i + 1, command.argv.size()).all(arg,
                arg.matches("(?i)^(-f|--force|-i|--interactive|-n|--no-clobber|-T|--no-target-directory|-v|--verbose)$")
              )
            )
          )
        ) ||
        (
          lists.range(command.argv.size()).exists(target,
            target > 0 &&
            (
              (
                command.argv[target].startsWith("--target-directory=") &&
                canonical_path(command.argv[target].substring(19)) == "/etc/sudoers.d"
              ) ||
              (
                command.argv[target].matches("^-[^-]*t.+$") &&
                canonical_path(command.argv[target].substring(command.argv[target].indexOf("t") + 1)) == "/etc/sudoers.d"
              )
            ) &&
            !lists.range(command.argv.size()).exists(k,
              k > target &&
              (
                command.argv[k] in ["-t", "--target-directory"] ||
                command.argv[k].startsWith("--target-directory=") ||
                command.argv[k].matches("^-[^-]*t.+$")
              )
            )
          ) &&
          lists.range(command.argv.size()).exists(i,
            i > 0 &&
            !command.argv[i].startsWith("-") &&
            (i == 1 || !command.argv[i - 1].matches("(?i)^(-S|--suffix|-g|--group|-m|--mode|-o|--owner|--strip-program|--context|--sparse)$"))
          )
        )
      )
    )
  )
tags: [attack.t1548]
